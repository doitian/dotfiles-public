set -g escape-time 0
set -g history-limit 50000
# WIN # set -g default-command "pwsh"
set -g default-command "env TERM=xterm-256color zsh" # LINUX #
# WIN # set -g default-terminal "xterm-256color"
set -g default-terminal "tmux-256color" # LINUX #
set -ga terminal-overrides ",*256col*:RGB"

set -g set-titles on
set -g set-titles-string '[#S:#I]#{?SSH_TTY,#h:,} #W'

set -g base-index 1
set -g pane-base-index 1

set -g bell-action other
set -g buffer-limit 100 # LINUX #
set -g focus-events on
set -g visual-bell on

######################
###      Env       ###
######################
set -ga update-environment BAT_THEME
set -ga update-environment COLORTERM
set -ga update-environment FZF_DEFAULT_OPTS
set -ga update-environment LAZY
set -ga update-environment LG_CONFIG_FILE
set -ga update-environment TERM_BACKGROUND

set -ga update-environment DISPLAY
set -ga update-environment WAYLAND_DISPLAY
set -ga update-environment XDG_RUNTIME_DIR

######################
###    Keymaps     ###
######################
set -g status-keys emacs
set -g mode-keys vi
set -g prefix ^q

unbind ^b
bind ^q send-prefix
bind -N "Create a new window" Enter new-window
bind -N "Switch to the last session" Tab switch-client -l
bind -N "Switch to the next session" J switch-client -n
bind -N "Switch to the previous session" K switch-client -p
bind -N "Kill current window" X confirm-before -p "kill-window #W? (y/n)" kill-window
bind -N "Rename pane" P command-prompt -p 'Pane title' 'select-pane -T "%%"'

bind -r ^p previous-window
bind -r ^n next-window
bind -N "Select the left pane" -r ^h select-pane -L
bind -N "Select the pane below" -r ^j select-pane -D
bind -N "Select the pane above" -r ^k select-pane -U
bind -N "Select the right pane" -r ^l select-pane -R

bind -N "Split pane vertically in current path" v split-window -h -c "#{pane_current_path}"
bind -N "Split pane horizontally in current path" V split-window -c "#{pane_current_path}"
bind -N "Create a new window in current path" C new-window -c "#{pane_current_path}"
bind -N "Hide pane in a background window" h break-pane -d
bind -N "Join pane into the last window" H join-pane -h -t :! # LINUX #
# WIN # bind H command-prompt -p "Join into window" "join-pane -h -t ':%%'"
bind -N "Join a pane from another window" j choose-tree -Zw "join-pane -h -s '%%'" # LINUX #
# WIN # bind j command-prompt -p "Join pane" "join-pane -h -s ':%%' ; select-pane -t :.1"

bind -N "Edit scrollback in editor" e capture-pane -eJS - \; new-window -n scrollback 'tmux show-buffer | nvim +TermHl +$; tmux delete-buffer'
bind -N "Clear screen and scrollback" k clear-history \; send-keys C-l
bind -N "Write buffer to clipboard" y run-shell "tmux show-buffer | ctrlc"
bind -N "Insert password" * run-shell "tmux split-window 'printf %s \"\$(fpass show -o -f)\" | tmux load-buffer -b fpass - && tmux paste-buffer -d -b fpass -t #{pane_id}'" # LINUX #
# WIN # bind * run-shell "tmux split-window -t '#{session_name}' '$PSNativeCommandUseErrorActionPreference = $false; $secret = @(fpass show -o -f) -join ([char]10); if ($secret) { tmux send-keys -t ''#{pane_id}'' -l -- $secret }'"

# WIN # bind . command-prompt -p "Move window" "move-window -t ':%%' ; refresh-client -S"
bind -N "Renumber windows" R move-window -r # LINUX #
bind -N "FZF Attach" s new-window -n TMUX_FZF_WIN "tmux-fzf-session"
bind -N "FZF Pane" f new-window -n TMUX_FZF_WIN "tmux-fzf-pane -s -p"
bind -N "Find window" F command-prompt 'find-window -Z "%%"'
bind -N "FZF Pane (All Sessions)" w new-window -n TMUX_FZF_WIN "tmux-fzf-pane -a -p"
bind -N "Tools menu (current path)" g display-menu -T "#[align=centre]Tools (current path)" \
    "Lazygit" g "new-window -c '#{pane_current_path}' lazygit" \
    "tuicr" r "new-window -c '#{pane_current_path}' tuicr" \
    "Yazi" y "new-window -c '#{pane_current_path}' yazi" \
    "Agent CLI" a "new-window -c '#{pane_current_path}' fa" \
    "Agent Berth" b "new-window -c '#{pane_current_path}' agent-berth"
bind -N "Tools menu (default path)" G display-menu -T "#[align=centre]Tools (default path)" \
    "Lazygit" g "new-window lazygit" \
    "tuicr" r "new-window tuicr" \
    "Yazi" y "new-window yazi" \
    "Agent CLI" a "new-window fa" \
    "Agent Berth" b "new-window agent-berth"
bind -N "Agent TUI" A run-shell "agent-berth tui --tmux"
bind -N "Attach to agent in current session" a new-window -n TMUX_FZF_WIN "agent-berth attach -p -s"
bind -N "Attach to agent" ^a new-window -n TMUX_FZF_WIN "agent-berth attach -p"
bind -N "Choose a window from a list" W choose-tree -Zw
bind -N "Choose a session from a list" S choose-session

set -s extended-keys on # LINUX #
set -s extended-keys-format csi-u # LINUX #
set -as terminal-features ",*:extkeys,xterm-256color:progressbar" # LINUX #
bind -n S-Enter send-keys -l "\033[13;2u" # LINUX #
# WIN # set-hook -g session-created 'set -g extended-keys on'

set-hook -g pane-command-started 'refresh-client -S'
set-hook -g pane-command-finished 'refresh-client -S'

######################
###     Theme      ###
######################
# bg         colour235
# fg         colour189
# cyan       colour116
# -black     colour234
# gray       colour237
# magenta    colour183
# pink       colour218
# red        colour211
# green      colour151
# -yellow    colour223
# blue       colour111
# orange     colour216
# black4     colour238
# dim        colour249

set -g status "on"
set -g status-justify left
set -g status-style "fg=colour189,bg=colour235"
set -g status-left-length 21
set -g status-right-length 27

set -g status-left "#[fg=colour235]#{?client_prefix,#[bg=colour211],#{?SSH_TTY,#[bg=colour183],#[bg=colour151]}} S #[fg=colour189,bg=colour235,italics] #{=/15/…:session_name} #[noitalics]"
set -g status-right "#[fg=colour189,bg=colour238] ⁄ #[bg=colour237] #{=/21/…:#{b:pane_current_path}} "
set -g @pb_slice "#{?#{e|<:#{pane_pb_progress},13},󰪞,#{?#{e|<:#{pane_pb_progress},25},󰪟,#{?#{e|<:#{pane_pb_progress},38},󰪠,#{?#{e|<:#{pane_pb_progress},50},󰪡,#{?#{e|<:#{pane_pb_progress},63},󰪢,#{?#{e|<:#{pane_pb_progress},75},󰪣,#{?#{e|<:#{pane_pb_progress},88},󰪤,󰪥}}}}}}}"
set -g @pb_icon "#{?#{==:#{pane_pb_state},error}, #[fg=colour211]󰅙,#{?#{==:#{pane_pb_state},indeterminate}, #[fg=colour116],#{?#{&&:#{pane_pb_state},#{!=:#{pane_pb_state},hidden}},#{?#{e|<:#{pane_pb_progress},100}, #[fg=colour116]#{E:@pb_slice}, #[fg=colour151]󰗠},#{?pane_command_running, #[fg=colour116]󰐰,}}}}"
set -g window-status-format "#[noreverse]#{?window_bell_flag,#[fg=colour235#,bg=colour211],#[fg=colour249#,bg=colour238]} #I #{?window_activity_flag,#[fg=colour211],#{?window_marked_flag,#[fg=colour111],#[fg=colour249]}}#[bg=colour235] #W#{E:@pb_icon} "
set -g window-status-current-format "#[noreverse]#[fg=colour235,bg=colour216] #{?window_zoomed_flag,Z,#I} #{?window_bell_flag,#[fg=colour211],#[fg=colour189]}#[bg=colour235] #W#{E:@pb_icon} "

setw -g window-status-activity-style "fg=colour189,bg=colour235,none"
setw -g window-status-separator ""
setw -g window-status-style "fg=colour189,bg=colour235,none"
setw -g window-status-current-style "none"

set -g message-style "fg=colour116,bg=colour237"
set -g message-command-style "fg=colour116,bg=colour237"

set -g pane-border-style "fg=colour237"
set -g pane-active-border-style "fg=colour111"

setw -g clock-mode-colour "colour111"
setw -g mode-style "none,fg=colour235,bg=#dc8a78"

set -g menu-style "fg=colour235" # LINUX #
set -g menu-selected-style "fg=colour235,bg=yellow" # LINUX #
set -g menu-border-style "fg=colour237" # LINUX #
