[env._]
path = ["{{config_root}}/node_modules/.bin"]

[tasks."pre-commit:typos"]
run = "typos"

[tasks.pre-commit]
depends = ["pre-commit:*"]

[tasks.build]
alias = "default"
run = ["bun install", "bun run build"]
sources = [
  "package.json",
  "bun.lock",
  "build.js",
  "src/**/*.js",
  "../private/src/**/*.js",
]

[tasks.clean]
run = "fd --no-ignore -t f . dist -x rm"

[tasks.update-skills]
description = "Update AI skills"
usage = '''
arg "[skill]" help="Skill name under ai/skills to update (default: all)"
'''
run = "bunx skills update -g -y{% if usage.skill %} {{usage.skill}}{% endif %}"
