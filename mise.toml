[env._]
path = ["{{config_root}}/node_modules/.bin"]

[tasks."pre-commit:typos"]
run = "typos"

[tasks.pre-commit]
depends = ["pre-commit:*"]

[tasks.build]
alias = "default"
run = ["bun install", "bun run build"]
sources = [
  "package.json",
  "bun.lock",
  "build.js",
  "src/**/*.js",
  "../private/src/**/*.js",
]

[tasks.clean]
run = "fd --no-ignore -t f . dist -x rm"

[tasks.update-skills]
description = "Update AI skills via opencode"
usage = '''
arg "[skill]" help="Skill name under ai/skills to update (default: all)"
'''
run = 'opencode run --auto -m opencode-go/deepseek-v4.1-flash --title update-skills "{% if usage.skill %}Only update ai/skills/{{usage.skill}}. {% else %}Update every skill under ai/skills/. {% endif %}Origin sources: gh-stack is https://github.com/github/gh-stack (path skills/gh-stack); sync SKILL.md and references from that origin. Every other skill is local to this repository; do not replace local skills from the internet. Do not commit."'
