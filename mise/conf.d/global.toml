[env]
_.path = [".dotfiles/repos/public/dist/mise-tasks"]

[tool_alias]
process-compose = "github:F1bonacc1/process-compose"

[settings]

[settings.python]
uv_venv_auto = "create|source"

[settings.npm]
package_manager = "bun"

# ============================================================================
# Global tasks (g:*)
# ============================================================================

[tasks."g:up:uv"]
hide = true
description = "Update all uv tools"
dir = "~"
run = "osc-progress uv tool update --all"

[tasks."g:up:bun"]
hide = true
description = "Update all bun global packages"
dir = "~"
run = "osc-progress bun update -g --latest"

[tasks."g:up:plugins"]
hide = true
description = "Update user-scope plugins for pi, opencode, and claude"
dir = "~"
run = "g-up-plugins"

[tasks."g:add:uv:all"]
hide = true
description = "Install uv tools"
dir = "~"
run = "true"

[tasks."g:add:bun:all"]
hide = true
description = "Install all bun global packages"
dir = "~"
run = [
  "osc-progress 1/2 bun add -g @opencode/cli",
  "osc-progress 2/2 bun add -g --ignore-scripts @earendil-works/pi-coding-agent",
]

[tasks."g:add:gh:all"]
hide = true
description = "Install gh extensions"
dir = "~"
run = ["osc-progress gh extension install github/gh-stack"]

[tasks."g:add:pi:all"]
hide = true
description = "Install pi extensions"
dir = "~"
run = ["osc-progress pi install npm:pi-advisor"]

[tasks."g:add:sprite"]
hide = true
description = "Install sprites CLI"
dir = "~"
shell = "{% if os() == 'windows' %}pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -Command{% else %}bash -c -o errexit{% endif %}"
run = "curl -fsSL https://sprites.dev/install.sh | bash"
run_windows = [
  "Invoke-WebRequest 'https://sprites.dev/install.ps1' -OutFile (Join-Path ([IO.Path]::GetTempPath()) 'sprite-install.ps1')",
  "$installer = Join-Path ([IO.Path]::GetTempPath()) 'sprite-install.ps1'; try { & $installer } finally { Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue }",
]

[tasks."g:add:plannotator"]
hide = true
description = "Install plannotator CLI only"
dir = "~"
shell = "{% if os() == 'windows' %}pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -Command{% else %}bash -c -o errexit{% endif %}"
run = "curl -fsSL https://plannotator.ai/install.sh | bash -s -- --minimal"
run_windows = [
  "Invoke-WebRequest 'https://plannotator.ai/install.ps1' -OutFile (Join-Path ([IO.Path]::GetTempPath()) 'plannotator-install.ps1')",
  "$installer = Join-Path ([IO.Path]::GetTempPath()) 'plannotator-install.ps1'; try { & $installer -Minimal } finally { Remove-Item -LiteralPath $installer -Force -ErrorAction SilentlyContinue }",
]

[tasks."g:clean:all"]
hide = true
dir = "~"
description = "Clean up all apps"
run = "true"
run_windows = "osc-progress scoop cleanup -a -k"

[tasks."g:up:all"]
hide = true
alias = "g:up"
description = "Update all apps"
dir = "~"
raw = true
depends_post = ["g:clean:all"]
run = "g-up-all-linux"
run_windows = "g-up-all-windows"

[tasks."g:secrets:unlock"]
hide = true
description = "Run Bun.secrets.set to unlock secrets for terminals"
run = """
#!/usr/bin/env bun
await Bun.secrets.set({service:"me.iany.bin",name:"_unlock",value:"true"});
"""

[tasks."g:mise:github-token"]
hide = true
description = "Create mise GitHub token file from gh auth token"
shell = "sh -c -o errexit"
run = '''
mkdir -p ~/.config/mise
umask 077
cat > ~/.config/mise/github_tokens.toml <<EOF
[tokens."github.com"]
token = "$(gh auth token)"
EOF
'''

[tasks."g:claude:ce:enable"]
hide = true
description = "Install the compound-engineering plugin for claude"
run = [
  "osc-progress 1/2 claude plugin marketplace add EveryInc/compound-engineering-plugin --scope user",
  "osc-progress 2/2 claude plugin install compound-engineering@compound-engineering-plugin --scope user",
]

[tasks."g:claude:ce:disable"]
hide = true
description = "Disable the compound-engineering plugin for claude"
run = "claude plugin disable compound-engineering@compound-engineering-plugin --scope user"

[tasks."g:claude:plannotator:enable"]
hide = true
description = "Install the plannotator plugin and skills for claude"
run = [
  "osc-progress 1/3 claude plugin marketplace add backnotprop/plannotator --scope user",
  "osc-progress 2/3 claude plugin install plannotator@plannotator --scope user",
  "osc-progress 3/3 bunx skills add backnotprop/plannotator/apps/skills/core --agent claude-code --global --yes",
]

[tasks."g:claude:plannotator:disable"]
hide = true
description = "Disable the plannotator plugin and remove its skills for claude"
run = [
  "bunx skills remove plannotator plannotator-annotate plannotator-last plannotator-review --agent claude-code --global --yes",
  "claude plugin disable plannotator@plannotator --scope user",
]

[tasks."g:opencode:ce:enable"]
hide = true
description = "Install the compound-engineering plugin for opencode"
run = "osc-progress opencode plugin compound-engineering@git+https://github.com/EveryInc/compound-engineering-plugin.git -g -f"

[tasks."g:opencode:ce:disable"]
hide = true
description = "Disable the compound-engineering plugin for opencode"
run = '''
FILE="$HOME/.config/opencode/opencode.jsonc"
PLUGIN="compound-engineering@git+https://github.com/EveryInc/compound-engineering-plugin.git"
if grep -qF "$PLUGIN" "$FILE"; then
  jq --arg p "$PLUGIN" '.plugin = (.plugin | map(select(. != $p)))' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
  echo "compound-engineering plugin disabled"
else
  echo "compound-engineering plugin already disabled"
fi
'''

[tasks."g:pi:ce:enable"]
hide = true
description = "Install the compound-engineering plugin for pi"
run = "osc-progress pi install git:github.com/EveryInc/compound-engineering-plugin"

[tasks."g:pi:ce:disable"]
hide = true
description = "Disable the compound-engineering plugin for pi"
run = "pi remove git:github.com/EveryInc/compound-engineering-plugin"

[tasks."p:claude:ce:enable"]
hide = true
description = "Install the compound-engineering plugin for claude (project)"
dir = "{{cwd}}"
run = [
  "osc-progress 1/2 claude plugin marketplace add EveryInc/compound-engineering-plugin --scope local",
  "osc-progress 2/2 claude plugin install compound-engineering@compound-engineering-plugin --scope local",
]

[tasks."p:claude:ce:disable"]
hide = true
description = "Disable the compound-engineering plugin for claude (project)"
dir = "{{cwd}}"
run = "claude plugin disable compound-engineering@compound-engineering-plugin --scope local"

[tasks."p:claude:plannotator:enable"]
hide = true
description = "Install the plannotator plugin and skills for claude (project)"
dir = "{{cwd}}"
run = [
  "osc-progress 1/3 claude plugin marketplace add backnotprop/plannotator --scope local",
  "osc-progress 2/3 claude plugin install plannotator@plannotator --scope local",
  "osc-progress 3/3 bunx skills add backnotprop/plannotator/apps/skills/core --agent claude-code --yes",
]

[tasks."p:claude:plannotator:disable"]
hide = true
description = "Disable the plannotator plugin and remove its skills for claude (project)"
dir = "{{cwd}}"
run = [
  "bunx skills remove plannotator plannotator-annotate plannotator-last plannotator-review --agent claude-code --yes",
  "claude plugin disable plannotator@plannotator --scope local",
]

[tasks."p:opencode:ce:enable"]
hide = true
description = "Install the compound-engineering plugin for opencode (project)"
dir = "{{cwd}}"
run = "osc-progress opencode plugin compound-engineering@git+https://github.com/EveryInc/compound-engineering-plugin.git -f"

[tasks."p:opencode:ce:disable"]
hide = true
description = "Disable the compound-engineering plugin for opencode (project)"
dir = "{{cwd}}"
run = '''
PLUGIN="compound-engineering@git+https://github.com/EveryInc/compound-engineering-plugin.git"
for FILE in opencode.jsonc opencode.json .opencode/opencode.jsonc .opencode/opencode.json; do
  if [ -f "$FILE" ] && grep -qF "$PLUGIN" "$FILE"; then
    jq --arg p "$PLUGIN" '.plugin = (.plugin | map(select(. != $p)))' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
    echo "compound-engineering plugin disabled"
    exit 0
  fi
done
echo "compound-engineering plugin already disabled"
'''

[tasks."p:pi:ce:enable"]
hide = true
description = "Install the compound-engineering plugin for pi (project)"
dir = "{{cwd}}"
run = "osc-progress pi install -l git:github.com/EveryInc/compound-engineering-plugin"

[tasks."p:pi:ce:disable"]
hide = true
description = "Disable the compound-engineering plugin for pi (project)"
dir = "{{cwd}}"
run = "pi remove -l git:github.com/EveryInc/compound-engineering-plugin"

[tasks."g:mcp"]
hide = true
description = "Enable, disable, or check status of an MCP server for a code agent"
usage = '''
arg "<action>" help="Action to perform" {
  choices "enable" "disable" "status"
}
arg "<agent>" help="Code agent (opencode, claude-desktop, claude-code)"
arg "<name>" help="MCP server name"
'''
run = "g-mcp {{usage.action}} {{usage.agent}} {{usage.name}}"

[tasks."g:codex:sandbox"]
hide = true
description = "Grant the Codex sandbox user read and execute access to tool directories"
run = "g-codex-sandbox"

# ============================================================================
# Preset tasks (preset:*)
# ============================================================================

[tasks."preset:ide"]
hide = true
description = "Activate mise in IDEs"
depends = ["preset:neovim", "preset:vscode", "preset:claude"]

[tasks."preset:neovim"]
hide = true
description = "Activate mise in neovim"
dir = "{{cwd}}"
run = "preset-neovim"

[tasks."preset:vscode"]
hide = true
description = "Activate mise in vscode"
dir = "{{cwd}}"
run = "preset-vscode"

[tasks."preset:claude"]
hide = true
description = "Activate mise in claude"
dir = "{{cwd}}"
run = "preset-claude"

[tasks."preset:paseo"]
hide = true
description = "Configure Paseo worktree setup with git wta"
dir = "{{cwd}}"
run = '''
#!/usr/bin/env bun
const file = Bun.file("paseo.json");
const config = await file.exists() ? await file.json() : {};
config.worktree ??= {};
config.worktree.setup = 'git wta --setup "$PASEO_SOURCE_CHECKOUT_PATH" "$PASEO_WORKTREE_PATH"';
await Bun.write(file, JSON.stringify(config, null, 2) + "\n");
'''

[tasks."preset:skills"]
hide = true
description = "Link .claude/skills and .agents/skills when only one exists"
dir = "{{cwd}}"
run = "preset-skills"

[tasks."preset:rust"]
hide = true
description = "Setup rust project"
dir = "{{cwd}}"
depends_post = ["preset:default", "preset:pre-commit"]
run = "preset-rust"

[tasks."preset:python"]
hide = true
description = "Setup python project"
dir = "{{cwd}}"
run = [
  "touch mise.toml",
  "mise config set -f mise.toml env._.python.venv.path .venv",
  "mise config set -f mise.toml env._.python.venv.create true -t bool",
]

[tasks."preset:pre-commit"]
hide = true
description = "Setup git pre-commit hook"
dir = "{{cwd}}"
run = [
  "touch mise.toml",
  "mise tasks add pre-commit:typos -- typos",
  "mise tasks add pre-commit -d pre-commit:*",
]

[tasks."preset:node"]
hide = true
description = "Setup node project"
dir = "{{cwd}}"
run = [
  "touch mise.toml",
  "{% raw %}mise config set -f mise.toml env._.path {{config_root}}/node_modules/.bin -t list{% endraw %}",
]

[tasks."preset:ghtoken"]
hide = true
description = "Use gh auth token"
dir = "{{cwd}}"
shell = "sh -c -o errexit"
run = [
  "touch mise.local.toml",
  '''{% raw %}mise config set -f mise.local.toml env.GITHUB_TOKEN.value "{{ exec(command='gh auth token') }}"{% endraw %}''',
  "mise config set -f mise.local.toml env.GITHUB_TOKEN.redact true",
]

[tasks."preset:default"]
hide = true
description = "Detect build system and create a simple default task"
dir = "{{cwd}}"
run = "preset-default"

[tasks."preset:cargo:workspace"]
hide = true
description = "Create a Cargo workspace"
dir = "{{cwd}}"
depends = ["preset:rust"]
run = "preset-cargo-workspace"

[tasks."preset:sccache:shm"]
hide = true
description = "Use ramdisk for sccache"
dir = "{{cwd}}"
run = "mise set --file mise.local.toml SCCACHE_DIR=/dev/shm/sccache"
